# Config for the committed fixture repos. Every `root: ..` is this checkout, so
# the fixtures resolve their runner from the repo's own node_modules and need no
# install of their own.
#
#   npx tsx src/cli.ts --config fixtures/covergen.fixtures.yaml preflight --repo vitest-esm-lib
#
# No Anthropic key is needed for preflight or baseline. `run` stops at generation
# without one.
anthropic:
  api_key_env: ANTHROPIC_API_KEY
gate:
  k: 3
  timeout_ms: 120000
  baseline_timeout_ms: 300000
segments:
  max_lines: 50
  max_per_file: 8
repos:
  - name: vitest-esm-lib
    root: ..
    cwd: fixtures/vitest-esm-lib
    runner: vitest
    sources: ["src/**/*.ts"]
  - name: bun-lib
    root: ..
    cwd: fixtures/bun-lib
    runner: bun
    sources: ["src/**/*.ts"]
    # Colocated specs, so override the bun default of src/__tests__/.
    spec_template: "{dir}/{base}.test{ext}"
  - name: jest-cjs
    root: ..
    cwd: fixtures/jest-cjs
    runner: jest
    sources: ["src/**/*.js"]
  - name: rspec-min
    root: ..
    cwd: fixtures/rspec-min
    runner: rspec
    sources: ["lib/**/*.rb"]
  - name: pytest-min
    root: ..
    cwd: fixtures/pytest-min
    runner: pytest
    sources: ["src/**/*.py"]
    pytest:
      # python3 rather than the default python, which many distributions omit.
      command: ["python3", "-m", "pytest"]
  - name: go-min
    root: ..
    cwd: fixtures/go-min
    runner: go
    # Go keeps tests beside the source, so the source globs have to exclude them.
    sources: ["**/*.go"]
    exclude: ["**/*_test.go"]
  - name: rust-min
    root: ..
    cwd: fixtures/rust-min
    runner: cargo
    # lib.rs is only a module declaration, so rates.rs is the only real target.
    sources: ["src/**/*.rs"]
  # The audit fixtures. Unlike the others, these ship deliberately bad tests:
  # one case of every shape `covergen audit` has a verdict for.
  - name: audit-vitest
    root: ..
    cwd: fixtures/audit-vitest
    runner: vitest
    sources: ["src/**/*.ts"]
  - name: audit-go
    root: ..
    cwd: fixtures/audit-go
    runner: go
    sources: ["**/*.go"]
    exclude: ["**/*_test.go"]
