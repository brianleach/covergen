# Example covergen config that points covergen at its own source tree.
# covergen.yaml itself is gitignored, so this file is the copy-and-run starting
# point: `cp covergen.covergen.example.yaml covergen.yaml`, or pass it directly
# with `--config`. `root: .` means the checkout you are standing in, so no
# sibling repo or worktree is needed to try the tool.
# claude-code, the default, spends a Claude subscription through the local
# Claude Code login. api is the backup and bills the Messages API per token.
generator: claude-code
anthropic:
  api_key_env: ANTHROPIC_API_KEY
  generator_model: claude-opus-5
  repair_model: claude-sonnet-5
gate:
  k: 3
  timeout_ms: 300000
  baseline_timeout_ms: 1800000
  max_repair_rounds: 3
mutation:
  enabled: true
  max_mutants: 5
  min_killed: 1
  timeout_ms: 300000
segments:
  max_lines: 50
  max_per_file: 8
repos:
  - name: covergen
    root: .
    runner: vitest
    sources: ["src/**/*.ts"]
    # No idiom_pack: the packs that ship in idioms/ are framework-specific (a
    # jsdom plus React Testing Library pack for Vitest, and the Jest, Bun and
    # RSpec equivalents). This project runs `environment: node` with no DOM, so
    # the component-testing advice in those packs does not apply and pointing at
    # one costs candidates and repair rounds on advice the runner cannot use.
    # A plain-node Vitest pack would belong here once one exists.
    validate:
      - ["npm", "run", "typecheck"]
      - ["npm", "test"]
